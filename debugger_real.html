<!DOCTYPE html>
<html>
<head>
    <title>Replay Debugger</title>
    <meta charset="UTF-8">
	<link id="stylesheet" rel="stylesheet" href="style_dark_plus.css">
</head>
<body>
    <input type="file" id="json_file_upload">
    <header>
        <div id="header">

        </div>
        <div style="justify-content: flex-end;">
            <button style="margin-right: 20pt;" onclick="document.body.classList.toggle('light-theme')"> </button>
        </div>
    </header>
    <main>
        <div id="inspector">
            <details>
                <summary><span class="icon"> </span> call stack</summary>
                <ul id="call-stack"></ul>
            </details>
            <details>
                <summary><span class="icon">󱒔 </span> variables</summary>
                <ul><table id="variables"></table></ul>
            </details>
            <details>
                <summary><span class="icon">󰈈 </span> watch</summary>
                <ul id="watch"></ul>
            </details>
            <details>
                <summary><span class="icon"> </span> breakpoints</summary>
                <ul id="breakpoints"></ul>
            </details>
            <details>
                <summary><span class="icon"> </span> outline</summary>
				<ul id="outline"></ul>
            </details>
            <details>
                <summary><span class="icon"> </span> exceptions</summary>
                <ul id="exceptions"></ul>
            </details>
			<details>
				<summary><span class="icon"> </span> explain</summary>
			</details>
        </div>
        <div id="resize"></div>
        <div class="right-panel">
            <div class="code">
                <div id="step-buttons">
                    <button style="cursor: grab;" id="grabber"></button>
                    <button onclick="jump_start()"> </button>
                    <button onclick="step_out(-1)"> </button>
                    <button onclick="step_into(-1)"> </button>
                    <button onclick="step_forward(-1)"> </button>

                    <button onclick="play()" id="playbtn"> </button>

                    <button onclick="step_forward()"> </button>
                    <button onclick="step_into()"> </button>
                    <button onclick="step_out()"> </button>
                    <button onclick="jump_end()"> </button>
                </div>
                <table id="code"></table>
            </div>
            <canvas id="minimap"></canvas>

            <div id="foot-resize"></div>
            <footer id="footer">
                <div id="console"> </div>
            </footer>
        </div>
    </main>

	<canvas id="flame-graph"></canvas>

    <div id="drop-file"><div> </div></div>
    <script>
const stylesheet = document.getElementById('stylesheet')

const header         = document.getElementById('header')
const step_buttons   = document.getElementById('step-buttons')
const grabber        = document.getElementById('grabber')
const code           = document.getElementById('code')
const inspector      = document.getElementById('inspector')
const call_stack_el  = document.getElementById('call-stack')
const variables      = document.getElementById('variables')
const breakpoints_el = document.getElementById('breakpoints')
const exceptions_el  = document.getElementById('exceptions')
const outline        = document.getElementById('outline')
const minimap        = document.getElementById('minimap')
const flame_graph    = document.getElementById('flame-graph')
const footer         = document.getElementById('footer')
const resize_handle  = document.getElementById('resize')
const foot_resize    = document.getElementById('foot-resize')
const upload         = document.getElementById('json_file_upload')
const drop_file      = document.getElementById('drop-file')

const play_btn = document.getElementById('playbtn')

let debug_trace  = null
let current_line = null // follow the appropriate format? or have the tabs actually work like tabs?
// let current_function = null

let call_tree       = null
let console_content = []

// TODO: conditional breakpoints, etc.
let breakpoints = []


// key events
document.body.onkeydown = (e) => {
	e.preventDefault()
    if (e.key === 'j')  step_forward(1)
    if (e.key === 'k')  step_forward(-1)
    if (e.key === 'l')  step_into(1)
    if (e.key === 'h')  step_out(-1)
    if (e.key === ' ')  play()
    if (e.key === '\r') jump_end()

    if (e.key === 't') {
        step_buttons.style.left = null
        step_buttons.style.top  = null

		if (stylesheet.href.includes('style_dark_plus.css')) {
			stylesheet.href = "style_noir.css"
		}
		else {
			stylesheet.href = "style_dark_plus.css"
		}
		set_position()
	}
}


grabber.onmousedown = e => {
	e.preventDefault()

    const step_rect = step_buttons.getBoundingClientRect()
    const m_x       = e.pageX - step_rect.x
    const m_y       = e.pageY - step_rect.y

    document.body.onmousemove = event => {
        let w = event.pageX - m_x
        let h = event.pageY - m_y

        step_buttons.style.left = `${w}px`
        step_buttons.style.top  = `${h}px`
    }
    document.body.onmouseup = e => {
        document.body.onmousemove  = null
        document.body.onmouseup    = null
    }
}

resize_handle.onmousedown = e => {
    e.preventDefault()
    document.body.onmousemove = event => {
        let w = event.pageX
        if (w < 100) w = 0
        inspector.style.flexBasis = `${w}px`
    }
    document.body.onmouseup = e => {
        document.body.onmousemove  = null
    }
}

foot_resize.ondblclick = e => {
    if (footer.style.display === 'block') {
        footer.style.display = 'none'
    }
    else {
        footer.style.display   = 'block'
        footer.style.flexBasis = '200px'
    }
}

foot_resize.onmousedown = e => {
    e.preventDefault()
    document.body.onmousemove = event => {
        let h = window.innerHeight - 50 - event.pageY
        if (h < 100) {
            footer.style.display   = 'none'
        }
        else {
            footer.style.display   = 'block'
            footer.style.flexBasis = `${h}px`
        }
    }
    document.body.onmouseup = e => {
        document.body.onmousemove  = null
    }
}

flame_graph.onmousedown = (e) => {
	document.body.onmousemove = (event) => {
		const total_steps = debug_trace.trace.length
		const step_width  = flame_graph.width / total_steps

		const next_step = Math.floor(event.pageX / step_width)

		if (next_step > current_line)
			scan_code(1, () => current_line !== next_step)
		else if (next_step < current_line)
			scan_code(-1, () => current_line !== next_step)

		set_position()
	}
	document.body.onmouseup = (e) => {
		document.body.onmousemove = null
		document.body.onmouseup   = null
	}

	document.body.onmousemove(e)
}


document.body.ondragover = (e) => {
    e.preventDefault()
    drop_file.style.display = 'flex'
}

document.body.ondragleave = (e) => {
    drop_file.style.display = 'none'
}

document.body.ondrop = (e) => {
    e.preventDefault()
    drop_file.style.display = 'none'
    upload.onchange({target: e.dataTransfer})
}

upload.onchange = (e) => {
    const file = e.target.files[0]
    if (!file) return

    const reader = new FileReader()
    reader.onload = (e) => {
        debug_trace = JSON.parse(e.target.result)

		let call_stack = null

		// build outline
        outline.innerHTML = ''

		let prev_fn = {fn: '', depth: 0}
		for (const [i, line] of debug_trace.trace.entries()) {
			const [fn, lineno, _, depth] = line

			if (fn !== prev_fn.fn || depth !== prev_fn.depth) {
				const indent = '  '.repeat(depth - 1)
				const fn_li  = document.createElement('li')
				fn_li.style.whiteSpace = 'pre'
				fn_li.style.cursor     = 'pointer'

				if (depth > prev_fn.depth) {
					fn_li.innerHTML = `${indent}<span class="function">${fn}</span>(...)`
					const next_call = {
						name:  fn,
						start: i,
						end:   debug_trace.trace.length,
						calls: [],
					}

                    if (call_tree !== null) {
                        call_stack.at(-1).calls.push(next_call)
                        call_stack.push(next_call)
                    }
                    else {
                        call_tree  = next_call
                        call_stack = [call_tree]
                    }
				}
				else {
					for (let j = 0; j < prev_fn.depth - depth; j++) {
						fn_li.innerHTML      = `${indent}<i>${fn}</i> `
                        fn_li.style.fontSize = '.9em'
                        fn_li.style.color    = 'var(--text-dark)'

						call_stack.at(-1).end = i - 1
						call_stack.pop()
					}
				}

				fn_li.onclick = (e) => {
					current_line = i
					set_position()
				}

				prev_fn = {fn: fn, depth: depth}
				outline.appendChild(fn_li)
			}
		}


        // build exceptions
        exceptions_el.innerHTML = ''

		for (const [i, line] of debug_trace.trace.entries()) {
            const [fn, lineno, _v, _d, _o, exception] = line
            if (exception === null) continue

            const exc_li     = document.createElement('li')
            exc_li.innerText = `${fn}:${lineno} ${debug_trace.sources[fn][lineno]}`
            exc_li.onclick   = (e) => {
                current_line = i
                set_position()
            }

            exceptions_el.appendChild(exc_li)
        }


		// build tabs
        header.innerHTML = ''
        for (const key of Object.keys(debug_trace.sources)) {
            let tab = document.createElement('span')
			tab.innerText = key
            tab.onclick = () => set_source(key)
            tab.classList.add('tab')

            header.appendChild(tab)
        }

		// show flame graph
		flame_graph.style.display = 'block'


        // build console
        console_content  = []
        footer.innerHTML = ''

        for (const [i, [_1, _2, _3, _4, output, _5]] of debug_trace.trace.entries()) {
            if (output === null) continue

            const [level, content] = output.split('\t')

            const out     = document.createElement('pre')
            out.innerText = content
            out.classList.add(level.toLowerCase())

            out.onclick = (e) => {
                current_line = i - 1
                set_position()
            }

            footer.appendChild(out)
            console_content.push({start: i, el: out})
        }

        current_line = 1
        jump_end()
    }

    reader.readAsText(file)
}

const scan_code = (dir, cond) => {
    let [source_name, lineno, locals, depth] = debug_trace.trace[current_line]

    do
    {
        current_line += dir
        current_line = Math.max(0, current_line)
        current_line = Math.min(debug_trace.trace.length - 1, current_line)

        const [new_source_name, new_lineno, new_locals, new_depth] = debug_trace.trace[current_line]; // WARN: load bearing semicolon

		// ...

        [source_name, lineno, locals, depth] = [new_source_name, new_lineno, new_locals, new_depth]
    }
    while (current_line < debug_trace.trace.length - 1
        && current_line > 0
        && !breakpoints.includes(`${source_name}:${lineno}`)
        && cond())
}


const jump_start = () => {
    scan_code(-1, () => true)
    set_position()
}

const jump_end = () => {
    scan_code(1, () => true)
    set_position()
}

const step_forward = (dir=1) => {
    depth = debug_trace.trace[current_line][3] 
    scan_code(dir, () => debug_trace.trace[current_line][3] > depth)
    set_position()
}

const step_into = (dir=1) => {
    scan_code(dir, () => false)
    set_position()
}

const step_out = (dir=1) => {
    depth = debug_trace.trace[current_line][3] 
    scan_code(dir, () => debug_trace.trace[current_line][3] >= depth)
    set_position()
}


let play_interval = null
const play = () => {
	if (play_interval) {
		clearInterval(play_interval)
		play_interval = null
		play_btn.innerText = ''
	}
	else {
		play_interval = setInterval(() => {
            step_into(1)

            const [fn, lineno, _1, _2] = debug_trace.trace[current_line]

            if      (current_line === debug_trace.trace.length - 1) play()
            else if (breakpoints.includes(`${fn}:${lineno}`))       play()
        }, 150)
		play_btn.innerText = ''
	}
}

const set_position = () => {
    let [source_name, lineno, locals, depth] = debug_trace.trace[current_line]
    set_source(source_name)

    // TODO: temp code
    call_stack_el.innerHTML = ''
	let stack_top = call_tree
	while (stack_top) {
        let funchint = document.createElement('li')
        funchint.innerHTML = `<span class="function">${stack_top.name}</span>(...)`

        call_stack_el.prepend(funchint)
		let calls = stack_top.calls
		stack_top = null

		for (const call of calls) {
			if (call.start <= current_line && call.end >= current_line) {
				stack_top = call
				break
			}
		}
	}

    variables.innerHTML = ''
    for (const [varname, value] of Object.entries(locals)) {
        let varhint  = document.createElement('tr')
		let name     = document.createElement('td')
		let equals   = document.createElement('td')
		let value_el = document.createElement('td')

        name.innerText     = varname
		equals.innerText   = ' := '

        if (value.length < 50) {
            for (const token of tokenize_line(value)) {
                let tok = document.createElement('span')
                tok.innerText = token.content
                tok.classList.add(token.type)

                value_el.appendChild(tok)
            }
        }
        else {
            value_el.innerText = value
        }

        varhint.appendChild(name)
        varhint.appendChild(equals)
        varhint.appendChild(value_el)
        variables.appendChild(varhint)
    }

    // output
    for (const output of console_content) {
        if (output.start <= current_line) {
            output.el.classList.add('printed')
        }
        else {
            output.el.classList.remove('printed')
        }
    }
}


// =========================== //
// === Syntax Highlighting === //
// =========================== //

const tokenize_line = (line) => {
    let tokens = []
    let re_matches = []

    while (line.length > 0) {
        if (re_matches = line.match(/^(def|self|is|in|not|and|or|as|True|False|None)\b(.*)/)) {
            tokens.push({type: 'keyword', content: re_matches[1]})
            line = re_matches[2]
        }
        else if (re_matches = line.match(/^(if|elif|else|while|for|return|break|try|except|raise)\b(.*)/)) {
            tokens.push({type: 'control', content: re_matches[1]})
            line = re_matches[2]
        }
        else if (re_matches = line.match(/^(int|str|bool|dict|tuple|list)\b(.*)/)) {
            tokens.push({type: 'type', content: re_matches[1]})
            line = re_matches[2]
        }
        else if (re_matches = line.match(/^([A-Z_][A-Z_0-9]+\b)(.*)/)) {
            tokens.push({type: 'constant', content: re_matches[1]})
            line = re_matches[2]
        }
        else if (re_matches = line.match(/^([A-Z][a-zA-Z_0-9]+)\b(.*)/)) {
            tokens.push({type: 'type', content: re_matches[1]})
            line = re_matches[2]
        }
        else if (re_matches = line.match(/^([a-zA-Z_][a-zA-Z_0-9]+)(\(.*)/)) {
            tokens.push({type: 'function', content: re_matches[1]})
            line = re_matches[2]
        }
        else if (re_matches = line.match(/^([a-zA-Z_][a-zA-Z_0-9]+\b)(.*)/)) {
            tokens.push({type: 'ident', content: re_matches[1]})
            line = re_matches[2]
        }
        else if (re_matches = line.match(/^("[^"]*")(.*)/)) {
            tokens.push({type: 'string', content: re_matches[1]})
            line = re_matches[2]
        }
        else if (re_matches = line.match(/^('[^']*')(.*)/)) {
            tokens.push({type: 'string', content: re_matches[1]})
            line = re_matches[2]
        }
        else if (re_matches = line.match(/^([0-9][0-9_.]*)(.*)/)) {
            tokens.push({type: 'numeric', content: re_matches[1]})
            line = re_matches[2]
        }
        else if (re_matches = line.match(/^(#.*)/)) {
            tokens.push({type: 'comment', content: re_matches[1]})
            return tokens
        }
        else if (re_matches = line.match(/^(\s+)(.*)/)) {
            tokens.push({type: 'whitespace', content: re_matches[1].replaceAll(' ', '‧')})
            line = re_matches[2]
        }
        else {
            tokens.push({type: 'other', content: line[0]})
            line = line.slice(1)
        }
    }

    return tokens
}


const set_source = (source_name) => {
    let tabs = document.getElementsByClassName('tab')
    for (const tab of tabs) {
        tab.classList.add('selected')
        if (tab.innerText === source_name) {
            tab.classList.add('selected')
        }
        else {
            tab.classList.remove('selected')
        }
    }

    code.innerHTML = ''

	const [fn, lineno, vars, depth, _o, exception] = debug_trace.trace[current_line]

    let source = debug_trace.sources[source_name]

    const start_indent = source[0].match(/^[\s]*/)[0]
    let   indent_level = 0

    for (const [line_number, _line] of source.entries()) {
        const line = _line.replace(start_indent, '')

        let row        = document.createElement('tr')
        let breakpoint = document.createElement('td')
        let number     = document.createElement('td')
        let python     = document.createElement('td')

        breakpoint.innerText = ' '
        number.innerText     = line_number + 1

		let is_current = fn === source_name && line_number === lineno

        if (is_current) {
			breakpoint.innerText = ' '
            breakpoint.style.color = 'var(--breakpoint)'

            python.classList.add('active-line')
            setTimeout(() => {
				// scroll to breakpoint instead to left align
				breakpoint.scrollIntoView({
					behavior: 'smooth',
					block:    'center',
					inline:   'start',
				})
            }, 5)
        }

        // why am I rerendering the whole thing for 1 breakpoint?
        const breakpoint_number = `${source_name}:${line_number}`
        if (breakpoints.includes(breakpoint_number)) {
			if (is_current) {
				breakpoint.innerText = ' '
			}

            breakpoint.style.color = 'var(--breakpoint)'
            breakpoint.onclick = e => {
                breakpoints = breakpoints.filter(i => i !== breakpoint_number)
                set_source(source_name)
            }
        }
        else {
            breakpoint.onclick = e => {
                breakpoints.push(breakpoint_number)
                set_source(source_name)
            }
        }

        breakpoint.classList.add('breakpoint')
        number.classList.add('line-number')
        python.classList.add('python')

        let tokens = tokenize_line(line)
        if (tokens.length > 0 && tokens[0].type === 'whitespace') {
            indent_level = tokens[0].content.length / 4
            tokens       = tokens.slice(1)
        }

		const indent = document.createElement('span')
		indent.style.color = 'var(--indent)'
		indent.innerText   = '┆    '.repeat(indent_level)

		python.appendChild(indent)

        for (let token of tokens) {
            let token_element       = document.createElement('span')
            token_element.innerText = token.content
            token_element.classList.add(token.type)

            if (token.type === 'ident' && Object.keys(vars).includes(token.content)) {
                token_element.style.borderBottom = '1px solid var(--accent)'
                token_element.title = vars[token.content]
            }

            python.appendChild(token_element)
        }

        row.appendChild(breakpoint)
        row.appendChild(number)
        row.appendChild(python)

        code.appendChild(row)

        if (is_current && exception !== null) {
            const error_cell = document.createElement('td')
            const error_msg  = document.createElement('div')
            error_msg.innerHTML = `<b>Exception at ${source_name}:${line_number}</b><br><p>${exception}</p>`
            error_msg.classList.add('error-msg')
            error_cell.appendChild(error_msg)

            const error_row  = document.createElement('tr')
            const error_icon = document.createElement('td')

            error_row.style.backgroundColor = 'var(--background-error)'
            error_icon.innerText            = ' '
            error_icon.style.textAlign      = 'right'
            error_icon.style.fontSize       = '1.2em'
            error_icon.style.color          = 'red'

            error_row.appendChild(error_icon)
            error_row.appendChild(document.createElement('td'))
            error_row.appendChild(error_cell)

            code.appendChild(error_row)
        }
    }

	update_breakpoints()
    render_minimap(source_name)
	render_flame_graph()
}


const update_breakpoints = () => {
	breakpoints_el.innerHTML = ''

	const [fn, lineno, _l, _d] = debug_trace.trace[current_line]

	for (const bp of breakpoints) {
		let li = document.createElement('li')
		li.innerText = `  ${bp}`
        li.onclick   = e => {
            breakpoints = breakpoints.filter(i => i !== bp)
            set_position()
        }

		if (bp === `${fn}:${lineno}`) {
            li.innerText   = `  ${bp}`
			li.style.color = 'var(--breakpoint)'
		}

		breakpoints_el.appendChild(li)
	}
}


const render_minimap = (source_name) => {
    const rect     = minimap.getBoundingClientRect()
    minimap.width  = rect.width
    minimap.height = rect.height

    const char_x  = 2
    const char_y  = 5
    const space_x = 1
    const space_y = 2

    const pad_top = 10

    let source = debug_trace.sources[source_name]

    const start_indent = source[0].match(/^[\s]*/)[0]
    let   indent_level = 0

	const ctx    = minimap.getContext('2d')
	const canvas = ctx.canvas

	const background = getComputedStyle(canvas).getPropertyValue('--background-dark')
	const keyword    = getComputedStyle(canvas).getPropertyValue('--keyword')
	const control    = getComputedStyle(canvas).getPropertyValue('--control')
	const type       = getComputedStyle(canvas).getPropertyValue('--type')
	const func       = getComputedStyle(canvas).getPropertyValue('--function')
	const constant   = getComputedStyle(canvas).getPropertyValue('--constant')
	const number     = getComputedStyle(canvas).getPropertyValue('--number')
	const string     = getComputedStyle(canvas).getPropertyValue('--string')
	const ident      = getComputedStyle(canvas).getPropertyValue('--ident')
	const comment    = getComputedStyle(canvas).getPropertyValue('--comment')

    ctx.fillStyle = background
    ctx.fillRect(0, 0, minimap.width, minimap.height)

    for (const [line_number, _line] of source.entries()) {
        const line = _line.replace(start_indent, '')

        let   x_pos  = 0
        const tokens = tokenize_line(line)
        for (const token of tokens) {
            // 10 x 5 chars?
            ctx.fillStyle = background

            switch (token.type) {
                case 'keyword': ctx.fillStyle = keyword; break
                case 'control': ctx.fillStyle = control; break
                case 'type': ctx.fillStyle = type; break
                case 'function': ctx.fillStyle = func; break
                case 'constant': ctx.fillStyle = constant; break
                case 'number': ctx.fillStyle = number; break
                case 'string':  ctx.fillStyle = string;  break
                case 'ident':   ctx.fillStyle = ident;   break
                case 'comment': ctx.fillStyle = comment; break
            }

            ctx.fillRect(x_pos, pad_top + (char_y + space_y) * line_number, char_x * token.content.length, char_y)
            x_pos += char_x * token.content.length
        }
    }
}


const render_flame_graph = () => {
	flame_graph.width  = window.innerWidth
	flame_graph.height = 50

	const total_steps  = debug_trace.trace.length
	const step_width   = flame_graph.width / total_steps


	const ctx    = flame_graph.getContext('2d')
	const canvas = ctx.canvas

	const bg_color = getComputedStyle(canvas).getPropertyValue('--background-dark')
	const fg_color = getComputedStyle(canvas).getPropertyValue('--accent')
	const bp_color = getComputedStyle(canvas).getPropertyValue('--breakpoint')

	ctx.fillStyle   = bg_color
	ctx.strokeStyle = 'none'
	ctx.lineWidth   = 0

	ctx.fillRect(0, 0, flame_graph.width, flame_graph.height)

    ctx.fillStyle   = fg_color + '66'
    ctx.strokeStyle = bg_color
    ctx.lineWidth   = 2

    let queue = [[0, call_tree]]
    while (queue.length > 0) {
        const [depth, top] = queue.pop()

        const start_x = top.start     * step_width
        const end_x   = (top.end + 1) * step_width

        ctx.fillRect(start_x, 50 - 10 * depth, end_x - start_x, -10)
        ctx.strokeRect(start_x, 50 - 10 * depth, end_x - start_x, -10)

        for (const call of top.calls) {
            queue.unshift([depth + 1, call])
        }
    }

	for (let i = 0; i < total_steps; i++) {
		const [fn, lineno, _, depth, output, exception] = debug_trace.trace[i]

		let height = 50 - 10 * depth

        if (output !== null) {
//			ctx.shadowBlur  = 5
//			ctx.shadowColor = 'black'
			ctx.fillStyle   = '#0a9bfc'

            ctx.font = '18px "Iosevka Nerd Font"'
            ctx.fillText('󱞁 ', i * step_width + 1, height + 5)
		}
		else if (exception !== null) {
//			ctx.shadowBlur  = 5
//			ctx.shadowColor = 'black'
			ctx.fillStyle   = '#ff0000'

            ctx.font = '18px "Iosevka Nerd Font"'
            ctx.fillText(' ', i * step_width, height + 5)
		}
		else if (breakpoints.includes(`${fn}:${lineno}`)) {
//			ctx.shadowBlur  = 5
//			ctx.shadowColor = 'black'
			ctx.strokeStyle = bp_color

			ctx.beginPath()
			ctx.ellipse(i * step_width + step_width/2, height, 5, 5, 0, 0, 2 * Math.PI)
			ctx.stroke()
		}
	}

    //ctx.shadowBlur  = 5
    //ctx.shadowColor = fg_color
    ctx.fillStyle   = fg_color
    ctx.fillRect(current_line * step_width + step_width/2 - 2, 0, 4, 50)
}
    </script>
